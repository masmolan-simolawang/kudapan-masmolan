
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#197b49">
<title>APLIKASI KUDAPAN MasMolan</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7e8;
  color: #294332;
}

header {
  background: linear-gradient(135deg, #197b49, #105c36);
  color: white;
  text-align: center;
  padding: 28px 15px;
}

.logo {
  font-size: 55px;
  background: white;
  border-radius: 50%;
  width: 85px;
  height: 85px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

h1 { font-size: 23px; margin: 14px 0 8px; }
header p { color: #fff1c6; }

main {
  width: 100%;
  max-width: 760px;
  margin: 20px auto;
  padding: 12px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 4px 15px #8b70401a;
  margin-bottom: 18px;
  border: 1px solid #f2e7d3;
}

h2, h3 { color: #197b49; }

button {
  background: #e58a27;
  color: white;
  border: 0;
  padding: 15px;
  border-radius: 12px;
  width: 100%;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

iframe {
  width: 100%;
  height: 1100px;
  border: 0;
  display: block;
}

footer {
  text-align: center;
  color: #66806c;
  padding: 20px;
  font-size: 12px;
}

@media (max-width: 600px) {
  header { padding: 23px 12px; }
  h1 { font-size: 20px; }
  main { padding: 10px; margin: 12px auto; }
  .card { padding: 15px; border-radius: 14px; }
  iframe { height: 1400px; }
  button { font-size: 15px; padding: 14px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">🥗</div>
  <h1>APLIKASI KUDAPAN MasMolan</h1>
  <p>Puskesmas Simolawang · 2027</p>
</header>

<main>
  <div class="card">
    <h2>Selamat Datang, Kader Posyandu</h2>
    <p>Mari dukung balita sehat melalui pemberian kudapan bergizi.</p>
    <button onclick="document.getElementById('form').scrollIntoView({behavior:'smooth'})">
      MULAI ISI FORMULIR
    </button>
  </div>

  <div class="card" id="form">
    <h3>Formulir Intervensi Kudapan 2027</h3>
    <iframe
      title="Formulir KUDAPAN 2027"
      src="https://docs.google.com/forms/d/e/1FAIpQLScF84i31IkAfDfdS028xNYW0U7p2hyXLdQJBpHP_ft9dDobZQ/viewform?embedded=true">
    </iframe>
    <p>
      Jika formulir tidak muncul, 
      <a href="https://docs.google.com/forms/d/e/1FAIpQLScF84i31IkAfDfdS028xNYW0U7p2hyXLdQJBpHP_ft9dDobZQ/viewform" target="_blank">
        klik di sini untuk membuka formulir.
      </a>
    </p>
  </div>
</main>

<footer>
  APLIKASI KUDAPAN MasMolan<br>
  Puskesmas Simolawang
</footer>

</body>
</html>
