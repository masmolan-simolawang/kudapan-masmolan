
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7e8;
  color: #294332;
}

header {
  background:
    radial-gradient(circle at 15% 20%, #e9c65d 0 5%, transparent 6%),
    radial-gradient(circle at 85% 30%, #f5a64a 0 6%, transparent 7%),
    linear-gradient(135deg, #197b49, #105c36);
  color: white;
  text-align: center;
  padding: 28px 15px;
}

.logo {
  font-size: 55px;
  background: #ffffff;
  border-radius: 50%;
  width: 85px;
  height: 85px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

h1 {
  font-size: 23px;
  margin: 14px 0 8px;
}

header p {
  color: #fff1c6;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 20px auto;
  padding: 12px;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 4px 15px #8b70401a;
  margin-bottom: 18px;
  border: 1px solid #f2e7d3;
}

h2, h3 {
  color: #197b49;
}

button {
  background: #e58a27;
  color: white;
  border: 0;
  padding: 15px;
  border-radius: 12px;
  width: 100%;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

  width: 100%;
  min-height: 1100px;
  border: 0;
  display: block;
}

  overflow: hidden;

  color: #66806c;
  padding: 20px;

  header {
    padding: 23px 12px;

  h1 {
    font-size: 20px;
  }

  main {
    padding: 10px;
    margin: 12px auto;
  }

  .card {
    padding: 15px;
    border-radius: 14px;
  }

  iframe {
    min-height: 1400px;
  }

  button {
    font-size: 15px;
    padding: 14px;
  }
